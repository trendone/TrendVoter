security:
    encoders:
        Symfony\Component\Security\Core\User\User:
            algorithm: sha512
            encode_as_base64: false
            iterations: 1

    providers:
        in_memory:
            memory:
                users: "%users%"

    firewalls:
        dev:
            pattern:  ^/(_(profiler|wdt)|css|images|js)/
            security: false
        
        login:
            pattern: ^/admin/login/$
            security: false
        
        admin_area:
            pattern: ^/admin
            form_login:
                login_path: toa_layout_security_login
                check_path: toa_layout_security_check
            logout:
                path: toa_layout_security_logout
                target: /admin
                invalidate_session: false
            remember_me:
                key: "%secret%"
